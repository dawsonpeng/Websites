<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong</title>
    <style>
        :root {
            --bg: #0f1115;
            --panel: #161a22;
            --accent: #58a6ff;
            --text: #e6edf3;
            --muted: #9aa4b2;
            --success: #3fb950;
            --danger: #f85149;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            background: radial-gradient(1200px 600px at 10% -20%, #1a1f2b 10%, transparent 40%),
                        radial-gradient(1000px 500px at 120% 10%, #1a1f2b 10%, transparent 40%),
                        var(--bg);
            color: var(--text);
            font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .shell {
            width: 100%;
            max-width: 1000px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .title {
            font-weight: 700;
            letter-spacing: 0.5px;
            font-size: 20px;
            color: var(--text);
        }

        .controls {
            color: var(--muted);
            font-size: 12px;
        }

        .panel {
            background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.2));
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            box-shadow:
                0 10px 30px rgba(0,0,0,0.35),
                inset 0 1px 0 rgba(255,255,255,0.05);
            overflow: hidden;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: rgba(0,0,0,0.25);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .score {
            display: flex;
            align-items: baseline;
            gap: 12px;
            font-variant-numeric: tabular-nums;
        }

        .score span {
            font-weight: 800;
            font-size: 22px;
        }

        .score .left { color: var(--success); }
        .score .right { color: var(--danger); }

        .buttons {
            display: flex;
            gap: 8px;
        }

        button {
            background: rgba(88, 166, 255, 0.12);
            color: var(--text);
            border: 1px solid rgba(88, 166, 255, 0.35);
            border-radius: 10px;
            padding: 6px 10px;
            font-size: 12px;
            cursor: pointer;
            transition: transform 0.08s ease, background 0.2s ease;
        }

        button:hover { background: rgba(88, 166, 255, 0.18); }
        button:active { transform: translateY(1px); }

        .canvas-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: radial-gradient(800px 400px at 50% -10%, rgba(88,166,255,0.12), transparent 60%),
                        radial-gradient(900px 500px at 50% 120%, rgba(63,185,80,0.08), transparent 60%),
                        #0b0e13;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .hint {
            position: absolute;
            left: 12px;
            bottom: 10px;
            color: var(--muted);
            font-size: 12px;
            opacity: 0.85;
            user-select: none;
        }

        .center-hud {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: var(--text);
            text-shadow: 0 2px 12px rgba(0,0,0,0.4);
            user-select: none;
            pointer-events: none;
        }

        .center-hud .big {
            font-size: 38px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .center-hud .small { color: var(--muted); font-size: 13px; }
    </style>
    <!-- No external libraries required -->
    <script>
        // Game constants
        const BASE_W = 960; // logical width
        const BASE_H = 540; // logical height (16:9)
        const PADDLE_W = 14;
        const PADDLE_H = 90;
        const BALL_R = 8;
        const PADDLE_SPEED = 420; // px/sec
        const BALL_SPEED_START = 360; // px/sec
        const BALL_SPEED_MAX = 880;
        const BALL_ACCEL = 1.06; // after each paddle hit

        let canvas, ctx;
        let dpr = Math.max(1, window.devicePixelRatio || 1);
        let lastTime = 0;
        let running = false;
        let cpuEnabled = true; // single-player by default
        let leftScore = 0, rightScore = 0;

        const keys = new Set();

        const left = { x: 32, y: BASE_H/2 - PADDLE_H/2, vy: 0 };
        const right = { x: BASE_W - 32 - PADDLE_W, y: BASE_H/2 - PADDLE_H/2, vy: 0 };
        const ball = { x: BASE_W/2, y: BASE_H/2, vx: 0, vy: 0, speed: BALL_SPEED_START };

        function randDir() {
            return Math.random() < 0.5 ? -1 : 1;
        }

        function serve(toLeft = Math.random() < 0.5) {
            ball.x = BASE_W/2;
            ball.y = BASE_H/2;
            ball.speed = BALL_SPEED_START;
            const angle = (Math.random() * 0.7 - 0.35) * Math.PI/3; // slight random angle
            const dir = toLeft ? -1 : 1;
            ball.vx = Math.cos(angle) * ball.speed * dir;
            ball.vy = Math.sin(angle) * ball.speed * randDir();
        }

        function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

        function resize() {
            const wrap = document.querySelector('.canvas-wrap');
            const rect = wrap.getBoundingClientRect();
            canvas.width = Math.round(rect.width * dpr);
            canvas.height = Math.round(rect.height * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function drawCourt() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Middle dashed line
            ctx.save();
            ctx.strokeStyle = 'rgba(255,255,255,0.22)';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 14]);
            ctx.beginPath();
            ctx.moveTo(BASE_W/2, 16);
            ctx.lineTo(BASE_W/2, BASE_H - 16);
            ctx.stroke();
            ctx.restore();

            // Boundaries glow
            ctx.save();
            ctx.strokeStyle = 'rgba(255,255,255,0.10)';
            ctx.lineWidth = 2;
            ctx.strokeRect(8, 8, BASE_W - 16, BASE_H - 16);
            ctx.restore();
        }

        function drawPaddle(p) {
            ctx.fillStyle = '#d2d7df';
            ctx.fillRect(p.x, p.y, PADDLE_W, PADDLE_H);
        }

        function drawBall() {
            const grd = ctx.createRadialGradient(ball.x - 3, ball.y - 3, 2, ball.x, ball.y, BALL_R + 3);
            grd.addColorStop(0, '#ffffff');
            grd.addColorStop(1, '#b9c1cc');
            ctx.fillStyle = grd;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
            ctx.fill();
        }

        function update(dt) {
            // Player input
            left.vy = (keys.has('w') ? -PADDLE_SPEED : 0) + (keys.has('s') ? PADDLE_SPEED : 0);
            if (!cpuEnabled) {
                right.vy = (keys.has('ArrowUp') ? -PADDLE_SPEED : 0) + (keys.has('ArrowDown') ? PADDLE_SPEED : 0);
            } else {
                // Simple CPU follows the ball with a limit
                const center = right.y + PADDLE_H/2;
                const diff = ball.y - center;
                const targetVy = clamp(diff * 5, -PADDLE_SPEED * 0.9, PADDLE_SPEED * 0.9);
                right.vy = targetVy;
            }

            left.y += left.vy * dt;
            right.y += right.vy * dt;

            left.y = clamp(left.y, 8, BASE_H - PADDLE_H - 8);
            right.y = clamp(right.y, 8, BASE_H - PADDLE_H - 8);

            ball.x += ball.vx * dt;
            ball.y += ball.vy * dt;

            // Wall collisions
            if (ball.y - BALL_R < 8) {
                ball.y = 8 + BALL_R;
                ball.vy = Math.abs(ball.vy);
            } else if (ball.y + BALL_R > BASE_H - 8) {
                ball.y = BASE_H - 8 - BALL_R;
                ball.vy = -Math.abs(ball.vy);
            }

            // Paddle collisions
            // Left paddle
            if (ball.x - BALL_R < left.x + PADDLE_W &&
                ball.y > left.y && ball.y < left.y + PADDLE_H &&
                ball.vx < 0) {
                ball.x = left.x + PADDLE_W + BALL_R;
                ball.vx = Math.abs(ball.vx) * BALL_ACCEL;
                ball.vy += left.vy * 0.15;
                ball.speed = Math.min(BALL_SPEED_MAX, Math.hypot(ball.vx, ball.vy));
                const dir = Math.atan2(ball.vy, ball.vx);
                ball.vx = Math.cos(dir) * ball.speed;
                ball.vy = Math.sin(dir) * ball.speed;
            }

            // Right paddle
            if (ball.x + BALL_R > right.x &&
                ball.y > right.y && ball.y < right.y + PADDLE_H &&
                ball.vx > 0) {
                ball.x = right.x - BALL_R;
                ball.vx = -Math.abs(ball.vx) * BALL_ACCEL;
                ball.vy += right.vy * 0.15;
                ball.speed = Math.min(BALL_SPEED_MAX, Math.hypot(ball.vx, ball.vy));
                const dir = Math.atan2(ball.vy, ball.vx);
                ball.vx = Math.cos(dir) * ball.speed;
                ball.vy = Math.sin(dir) * ball.speed;
            }

            // Scoring
            if (ball.x < -40) {
                rightScore += 1;
                serve(true);
                flashTopbar();
            } else if (ball.x > BASE_W + 40) {
                leftScore += 1;
                serve(false);
                flashTopbar();
            }
        }

        function render() {
            drawCourt();
            drawPaddle(left);
            drawPaddle(right);
            drawBall();
            // Scores (canvas overlay for crispness)
            ctx.save();
            ctx.font = 'bold 28px Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial';
            ctx.textAlign = 'center';
            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            ctx.fillText(String(leftScore).padStart(2, '0'), BASE_W * 0.35, 42);
            ctx.fillText(String(rightScore).padStart(2, '0'), BASE_W * 0.65, 42);
            ctx.restore();
        }

        function loop(t) {
            if (!running) { lastTime = t; requestAnimationFrame(loop); return; }
            const dt = Math.min(0.033, (t - lastTime) / 1000);
            lastTime = t;
            update(dt);
            render();
            requestAnimationFrame(loop);
        }

        function flashTopbar() {
            const bar = document.querySelector('.topbar');
            bar.animate([
                { background: 'rgba(0,0,0,0.25)' },
                { background: 'rgba(88,166,255,0.20)' },
                { background: 'rgba(0,0,0,0.25)' }
            ], { duration: 420, easing: 'ease-out' });
            syncScoreUI();
        }

        function syncScoreUI() {
            document.getElementById('leftScore').textContent = String(leftScore).padStart(2, '0');
            document.getElementById('rightScore').textContent = String(rightScore).padStart(2, '0');
        }

        function toggleRun(force) {
            running = force !== undefined ? !!force : !running;
            document.getElementById('hud').style.display = running ? 'none' : 'block';
        }

        function resetGame() {
            leftScore = 0; rightScore = 0;
            left.y = BASE_H/2 - PADDLE_H/2;
            right.y = BASE_H/2 - PADDLE_H/2;
            serve();
            syncScoreUI();
        }

        function onKey(e) {
            const k = e.key;
            if (e.type === 'keydown') {
                if (k === ' ') { e.preventDefault(); toggleRun(); return; }
                if (k === 'r' || k === 'R') { resetGame(); return; }
                if (k === '1') { cpuEnabled = true; toast('CPU enabled'); return; }
                if (k === '2') { cpuEnabled = false; toast('Two-player mode'); return; }
                keys.add(k);
            } else {
                keys.delete(k);
            }
        }

        let toastTimer = null;
        function toast(msg) {
            const el = document.getElementById('hudSmall');
            el.textContent = msg + '  ·  Space = Pause  ·  R = Reset';
            el.style.opacity = 1;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { el.style.opacity = 0.75; }, 1200);
        }

        window.addEventListener('load', () => {
            canvas = document.getElementById('game');
            ctx = canvas.getContext('2d');
            resize();
            serve();
            syncScoreUI();
            requestAnimationFrame(loop);
        });
        window.addEventListener('resize', resize);
        window.addEventListener('keydown', onKey);
        window.addEventListener('keyup', onKey);
    </script>
</head>
<body>
    <div class="shell">
        <div class="header">
            <div class="title">Pong</div>
            <div class="controls">W/S = Left · ↑/↓ = Right · 1 = CPU · 2 = 2P · Space = Pause · R = Reset</div>
        </div>
        <div class="panel">
            <div class="topbar">
                <div class="score">
                    <span class="left" id="leftScore">00</span>
                    <span class="right" id="rightScore">00</span>
                </div>
                <div class="buttons">
                    <button onclick="cpuEnabled = true">CPU</button>
                    <button onclick="cpuEnabled = false">2P</button>
                    <button onclick="toggleRun(true)">Play</button>
                    <button onclick="toggleRun(false)">Pause</button>
                    <button onclick="resetGame()">Reset</button>
                </div>
            </div>
            <div class="canvas-wrap">
                <canvas id="game" width="960" height="540" aria-label="Pong game area"></canvas>
                <div class="center-hud" id="hud">
                    <div class="big">Press Space to Play</div>
                    <div class="small" id="hudSmall">W/S = Left · ↑/↓ = Right · 1 = CPU · 2 = 2P · R = Reset</div>
                </div>
                <div class="hint">Tip: Try angling shots by hitting the ball off-center on the paddle.</div>
            </div>
        </div>
    </div>
</body>
</html>
